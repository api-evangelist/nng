name: NNG
description: NNG (NNG Software Developing and Commercial LLC), formerly Nav N Go, is
  a Budapest-based automotive navigation and location-based software company founded
  in 2004. Its flagship iGO platform delivers modular guidance, positioning, routing,
  map content management, and driver-assistance features such as Intelligent Speed
  Assistance, embedded in more than 60 million devices across 30+ vehicle brands and
  supplied to over 150 automotive and mobility partners in nearly 200 countries. NNG
  is backed by growth investment from Insight Partners. NNG sells embedded and OEM
  location-based software rather than a public developer API; no public developer portal,
  OpenAPI, SDK, or API documentation was found during enrichment.
